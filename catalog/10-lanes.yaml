# Coverage records for the fifteen market lanes.
#
# Every record here is `stub` or `external`. That is a deliberate statement:
# NONE of these integrations exists in this repository yet. A stub carries the
# schema, owner and intended port mapping; an external record is a metadata or
# export link only, because the system is unavailable or has no runnable
# interface.
#
# `source_url` is filled in only where the canonical URL is known. A missing URL
# is a gap to close before the record can graduate, not an invitation to guess:
# several projects in this space share a name, so an unqualified guess can point
# an experiment at the wrong repository.
records:
  # -- lane 1: frameworks and harnesses ------------------------------------
  - record_id: ukaisi/inspect-ai
    title: Inspect AI
    lane: 1
    capabilities: [runner, agent, sandbox, scorer, benchmark]
    runtime: in_process
    maturity: stub
    source_url: https://inspect.aisi.org.uk/
    license: MIT
    notes: >-
      First planned integration adapter: mature model, tool and sandbox
      integrations plus rescoring. Its multi-agent loop is deliberately NOT
      used; World must remain the only scheduler on every execution path.

  - record_id: harborframework/harbor
    title: Harbor (Terminal-Bench harness)
    lane: 1
    capabilities: [runner, benchmark, sandbox]
    runtime: oci
    maturity: stub
    source_url: https://www.harborframework.com/docs
    notes: Official Terminal-Bench 2.0 harness; abstracts container providers.

  - record_id: ai-alliance/cube-harness
    title: CUBE harness
    lane: 1
    capabilities: [runner, benchmark]
    runtime: subprocess
    maturity: stub
    source_url: https://github.com/The-AI-Alliance/cube-harness
    notes: Benchmark interchange; upstream harness is explicitly alpha.

  - record_id: maseval/maseval
    title: MASEval
    lane: 1
    capabilities: [runner, agent]
    runtime: in_process
    maturity: stub
    source_url: https://pypi.org/project/maseval/
    license: MIT
    notes: Strong system-level abstraction; PyPI still marks it alpha.

  # -- lane 2: product eval / LLMOps ---------------------------------------
  - record_id: langfuse/langfuse
    title: Langfuse
    lane: 2
    capabilities: [telemetry_sink]
    runtime: remote
    maturity: stub
    source_url: https://langfuse.com/self-hosting
    notes: >-
      Candidate trace viewer, chosen only after a usability spike. A viewer is a
      replaceable OpenTelemetry consumer and never stores canonical truth.

  - record_id: arize/phoenix
    title: Arize Phoenix
    lane: 2
    capabilities: [telemetry_sink]
    runtime: remote
    maturity: stub
    notes: Alternative trace viewer; same replaceability requirement.

  # -- lane 3: static knowledge and reasoning ------------------------------
  - record_id: hendrycks/mmlu
    title: MMLU / MMLU-Pro
    lane: 3
    capabilities: [benchmark, verifier]
    runtime: in_process
    maturity: external
    contamination_notes: >-
      Widely contaminated in modern pretraining corpora; a baseline for
      comparison, not evidence of novel capability.

  - record_id: openai/gsm8k
    title: GSM8K
    lane: 3
    capabilities: [benchmark, verifier]
    runtime: in_process
    maturity: external
    contamination_notes: Heavily contaminated; treat scores as a floor, not a measure.

