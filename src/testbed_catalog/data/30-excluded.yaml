# Deliberately excluded, recorded so the exclusion is visible and reversible.
#
# Project policy: no commercial or hosted-only services. They add a paid
# dependency, a network dependency and an account boundary to a testbed whose
# whole value is that a result can be reproduced by someone else later.
#
# These are `external` records with no adapter and no extra. Nothing here can be
# switched on, because nothing here has been built. If the policy changes, the
# record already states which port it would bind to.
records:
  - record_id: langchain/langsmith
    title: LangSmith
    lane: 2
    capabilities: [telemetry_sink, scorer]
    runtime: remote
    maturity: external
    notes: "Excluded: commercial hosted service. Langfuse or Phoenix covers the same port."

