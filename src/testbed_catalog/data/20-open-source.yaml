# Open-source integration targets.
#
# Every record here is `stub`: the adapter does not exist yet. What each record
# DOES carry is the binding decision -- which existing port the tool would plug
# into, which pip extra would install it, and which import proves it is present.
# That is the difference between a wish list and a plan.
#
# `source_verified: false` means nobody has confirmed the URL is the canonical
# home of that project. Several projects here share a name (Prism the
# eval-science tool vs PRISM Eval's BET; Orbit; Petri), so an unverified URL is
# a gap that blocks certification, not a detail.
records:
  # -- lane 1: frameworks and harnesses -----------------------------------
  - record_id: eleutherai/lm-evaluation-harness
    title: lm-evaluation-harness
    lane: 1
    capabilities: [runner, benchmark, verifier]
    runtime: subprocess
    maturity: stub
    source_url: https://github.com/EleutherAI/lm-evaluation-harness
    license: MIT
    extra: lm-eval
    requires: [lm_eval]
    notes: >-
      Highest coverage per adapter in the whole catalog: one bridge reaches most
      of lane 3. Integrated as a task/metric source rather than as a runner --
      see testbed/lm-eval-pack -- so World keeps ownership of scheduling.

  - record_id: stanford-crfm/helm
    title: HELM
    lane: 1
    capabilities: [runner, benchmark]
    runtime: subprocess
    maturity: stub
    source_url: https://github.com/stanford-crfm/helm
    notes: >-
      Large overlap with lm-eval for lane 3. Low marginal value once the lm-eval
      bridge exists; worth revisiting only for scenarios HELM covers uniquely.

  - record_id: openai/evals
    title: OpenAI Evals (open-source repository)
    lane: 1
    capabilities: [benchmark, scorer]
    runtime: subprocess
    maturity: stub
    source_url: https://github.com/openai/evals
    notes: >-
      The repository is open source, but its runner is bound to a metered API.
      Usable as a dataset and rubric source; the hosted Evals API is a separate,
      excluded record.

  - record_id: metr/vivaria
    title: Vivaria
    lane: 1
    capabilities: [runner, sandbox]
    runtime: oci
    maturity: stub
    notes: Heavy infrastructure; revisit only if METR-style task suites are adopted.

  - record_id: wittlab/orbit
    title: Orbit
    lane: 1
    capabilities: [runner, topology, world]
    runtime: in_process
    maturity: stub
    notes: >-
      Closest prior art for Inspect-native many-agent security experiments. Read
      before building the Inspect bridge, but do not adopt its shape: its
      orchestration and scheduler live inside its Inspect extension, which is
      exactly the coupling this kernel rejects. Publisher unconfirmed.

  # -- lane 2: product eval / LLMOps (open-source only) --------------------
  - record_id: promptfoo/promptfoo
